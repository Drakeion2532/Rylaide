name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        id: assemble
        run: |
          set +e
          gradle -p android :app:assembleDebug --console=plain > assemble.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILED" assemble.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
          fi
          exit $code

      - name: Inspect Opus library (temporary)
        if: always()
        run: |
          jar=$(find ~/.gradle -name 'concentus*.jar' ! -name '*sources*' | head -1)
          msg=$(unzip -l "$jar" | grep -E "Opus(Encoder|Decoder|Application|Signal|Exception)\.class" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Opus jar::${jar}%0A${msg}"

      - name: Run unit tests
        run: |
          set +e
          gradle -p android :app:testDebugUnitTest --console=plain > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|FAILED|Error|Exception|expected|What went wrong|Could not" test.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tests failed::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: rylaide-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
