name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          # Fails the build if a key-like string or a private file is in the repo.
          if git ls-files | grep -i -E '\.(jks|keystore|p12|pfx|pem|key|p8)$|google-services\.json|GoogleService-Info\.plist|service-account.*\.json|firebase-adminsdk|local\.properties|(^|/)\.env'; then
            echo "::error::A private file is tracked by git"; exit 1
          fi
          if git grep -n -I -E 'AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|gh[pousr]_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!.github/workflows/android-build.yml'; then
            echo "::error::A key-like string is in the repo"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        id: assemble
        run: |
          set +e
          gradle -p android :app:assembleDebug --console=plain > assemble.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILED" assemble.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
          fi
          exit $code

      - name: Run unit tests
        run: |
          set +e
          gradle -p android :app:testDebugUnitTest --console=plain > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |error:|FAILED|Error|Exception|expected|What went wrong|Could not" test.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tests failed::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: rylaide-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
