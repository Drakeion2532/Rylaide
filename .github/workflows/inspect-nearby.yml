name: Inspect Nearby API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: List Nearby connection options
        run: |
          curl -sSL -o n.aar https://dl.google.com/dl/android/maven2/com/google/android/gms/play-services-nearby/19.3.0/play-services-nearby-19.3.0.aar
          unzip -q n.aar classes.jar -d x
          out=""
          for c in AdvertisingOptions\$Builder DiscoveryOptions\$Builder ConnectionOptions\$Builder ConnectionType BandwidthInfo\$Quality Strategy; do
            out="$out%0A== $c"
            out="$out%0A$(javap -p -constants -cp x/classes.jar "com.google.android.gms.nearby.connection.$c" 2>&1 | grep -E 'public|static final' | sed 's/com.google.android.gms.nearby.connection.//g' | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          echo "::notice title=Nearby API::$out"
