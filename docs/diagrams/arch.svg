<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7FA8FF"/></marker></defs><rect width="1200" height="860" fill="#0F131B"/><text x="600" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="24" font-weight="700" fill="#FFB020">Rylaide ride session: target architecture</text><rect x="60" y="70" width="1080" height="64" rx="10" fill="#233049" stroke="#4B6490" stroke-width="2"/><text x="600.0" y="101.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">UI and diagnostics</text><text x="600.0" y="116.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Ride screen, session status (BOTH / INTERNET / MESH / DEGRADED / DISCONNECTED), test screen</text><rect x="60" y="170" width="1080" height="86" rx="10" fill="#2A3B2E" stroke="#4F7A58" stroke-width="2"/><text x="600.0" y="212.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">RideSession</text><text x="600.0" y="227.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Ride id, rider identity, roster, ride secret, session state machine, interruption handling (calls, audio focus, mic silenced)</text><rect x="60" y="292" width="350" height="110" rx="10" fill="#2B2A3A" stroke="#5C5A8A" stroke-width="2"/><text x="235.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">Audio engine (existing)</text><text x="235.0" y="361.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Capture, noise, VAD, Opus</text><text x="235.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Per-rider jitter buffer, PLC, mixer</text><rect x="450" y="292" width="350" height="110" rx="10" fill="#3A2A2A" stroke="#8A5C5C" stroke-width="2"/><text x="625.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">SessionCrypto (new)</text><text x="625.0" y="361.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">HKDF keys, AES-GCM per packet</text><text x="625.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">replay window, key epochs</text><rect x="840" y="292" width="300" height="110" rx="10" fill="#2B3340" stroke="#5A6B8A" stroke-width="2"/><text x="990.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">Packet layer (existing+)</text><text x="990.0" y="361.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">RelayPacket v2, RelayRouter</text><text x="990.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">dedupe, TTL, expiry, priority</text><rect x="60" y="438" width="1080" height="78" rx="10" fill="#3A3326" stroke="#8A7A4F" stroke-width="2"/><text x="600.0" y="476.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">TransportManager (new)</text><text x="600.0" y="491.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Health scoring, hysteresis, send on every usable path, receive from all, report state to RideSession</text><rect x="60" y="560" width="270" height="92" rx="10" fill="#1E2430" stroke="#3A4458" stroke-width="2"/><text x="195.0" y="605.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">NearbyTransport</text><text x="195.0" y="620.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">offline, existing</text><text x="195.0" y="636.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">Bluetooth + Wi-Fi</text><line x1="195" y1="560" x2="195" y2="516" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><rect x="330" y="560" width="270" height="92" rx="10" fill="#1E2430" stroke="#3A4458" stroke-width="2"/><text x="465.0" y="605.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">UdpTransport</text><text x="465.0" y="620.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">internet, existing</text><text x="465.0" y="636.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">fastest</text><line x1="465" y1="560" x2="465" y2="516" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><rect x="600" y="560" width="270" height="92" rx="10" fill="#1E2430" stroke="#3A4458" stroke-width="2"/><text x="735.0" y="605.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">WebSocketTransport</text><text x="735.0" y="620.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">internet, existing</text><text x="735.0" y="636.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">fallback</text><line x1="735" y1="560" x2="735" y2="516" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><rect x="870" y="560" width="270" height="92" rx="10" fill="#1A1F2A" stroke="#2A3242" stroke-width="2"/><text x="1005.0" y="605.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">DirectWifiTransport</text><text x="1005.0" y="620.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">future, only if</text><text x="1005.0" y="636.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">measured need</text><line x1="1005" y1="560" x2="1005" y2="516" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="690" width="550" height="70" rx="10" fill="#1B222E" stroke="#33405A" stroke-width="2"/><text x="335.0" y="724.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">Nearby neighbours (riders in radio range)</text><text x="335.0" y="739.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">multi-hop through riders, each hop re-forwards</text><rect x="650" y="690" width="490" height="70" rx="10" fill="#1B222E" stroke="#33405A" stroke-width="2"/><text x="895.0" y="724.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">Relay server (untrusted)</text><text x="895.0" y="739.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">sees only encrypted packets, cookie handshake, rate limits</text><line x1="195" y1="652" x2="195" y2="690" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="465" y1="652" x2="880" y2="690" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="735" y1="652" x2="900" y2="690" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="600" y1="134" x2="600" y2="170" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="235" y1="256" x2="235" y2="292" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="625" y1="256" x2="625" y2="292" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="990" y1="256" x2="990" y2="292" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><line x1="600" y1="402" x2="600" y2="438" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="600" y="800" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">Voice is sent on every usable path and duplicates are dropped by origin and counter, so a path change never needs a hand-over.</text><text x="600" y="824" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">New = to be built. Existing = already in the repo. Dashed future box = not built unless Nearby stays too slow.</text></svg>