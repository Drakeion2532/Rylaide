<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7FA8FF"/></marker></defs><rect width="1200" height="760" fill="#0F131B"/><text x="600" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="24" font-weight="700" fill="#FFB020">Session state machine (what the rider sees)</text><rect x="60" y="120" width="260" height="92" rx="10" fill="#2A3242" stroke="#6B7A96" stroke-width="2"/><text x="190.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">CONNECTING</text><text x="190.0" y="180.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">no path yet</text><rect x="470" y="120" width="260" height="92" rx="10" fill="#24402D" stroke="#6B7A96" stroke-width="2"/><text x="600.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">BOTH</text><text x="600.0" y="180.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">internet + offline link</text><rect x="880" y="120" width="260" height="92" rx="10" fill="#24402D" stroke="#6B7A96" stroke-width="2"/><text x="1010.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">INTERNET</text><text x="1010.0" y="180.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">only internet reaches riders</text><rect x="60" y="360" width="260" height="92" rx="10" fill="#24402D" stroke="#6B7A96" stroke-width="2"/><text x="190.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">MESH</text><text x="190.0" y="420.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">direct or via N hops</text><rect x="470" y="360" width="260" height="92" rx="10" fill="#4A3A1E" stroke="#6B7A96" stroke-width="2"/><text x="600.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">DEGRADED</text><text x="600.0" y="420.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">a path is up but poor</text><rect x="880" y="360" width="260" height="92" rx="10" fill="#4A2424" stroke="#6B7A96" stroke-width="2"/><text x="1010.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#F2F4F8">DISCONNECTED</text><text x="1010.0" y="420.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#B7C0D0">no rider reachable</text><line x1="320" y1="150" x2="470" y2="150" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="395.0" y="144.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">first path up</text><line x1="730" y1="150" x2="880" y2="150" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="805.0" y="144.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">offline link lost</text><line x1="880" y1="185" x2="730" y2="185" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="805.0" y="179.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">offline link back</text><line x1="190" y1="212" x2="190" y2="360" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="190.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">only offline up</text><line x1="600" y1="212" x2="600" y2="360" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="600.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">both poor</text><line x1="730" y1="380" x2="880" y2="380" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="805.0" y="374.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">all paths down 8 s</text><line x1="880" y1="415" x2="730" y2="415" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="805.0" y="409.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">a path recovers</text><line x1="320" y1="400" x2="470" y2="400" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="395.0" y="394.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">poor path</text><line x1="470" y1="430" x2="320" y2="430" stroke="#7FA8FF" stroke-width="2.5" marker-end="url(#a)"/><text x="395.0" y="424.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">recovers 5 s</text><line x1="1010" y1="212" x2="1010" y2="360" stroke="#FF9A7F" stroke-width="2.5" marker-end="url(#a)"/><text x="1010.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#D7DEEB">internet lost, no mesh</text><text x="60" y="540" font-family="Helvetica,Arial" font-size="16" font-weight="700" fill="#F2F4F8">Rules that keep it stable</text><text x="60" y="572" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">1. A path is DEGRADED after 3 s of round trip over 400 ms, loss over 10 percent over 5 s, or no packets for 3 s.</text><text x="60" y="602" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">2. A path is DOWN after 8 s of silence or a closed socket. It is UP again only after 5 s with round trip under 250 ms and loss under 5 percent.</text><text x="60" y="632" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">3. Minimum 5 s in any state before the rider-facing state changes, so the screen never flaps. Audio is never delayed by this: sending is per path, not per state.</text><text x="60" y="662" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">4. A DEGRADED path keeps sending voice but drops stale voice (older than 200 ms) and low-priority messages first. A DOWN path is probed every 2 s.</text><text x="60" y="692" font-family="Helvetica,Arial" font-size="14" fill="#B7C0D0">5. Start, stop and recovery are automatic. Nothing here places a phone call or shares a phone number.</text></svg>